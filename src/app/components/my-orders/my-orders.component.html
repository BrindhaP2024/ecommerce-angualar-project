<div class="my-orders-container">
  <h1 class="my-orders-title">My Orders</h1>

  <div *ngIf="loading" class="loading-spinner">
    Loading...
  </div>

  <div *ngIf="!loading && (!orderData || orderData.length === 0)" class="no-orders">
    <p>No orders placed yet.</p>
  </div>

  <div *ngIf="!loading && orderData && orderData.length > 0" class="order-list">
    <table class="order-table">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Date</th>
          <th>Total Price</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orderData" class="order-item">
          <td data-label="Order ID">#{{ order.id }}</td>
          <td data-label="Date">{{ order.orderDate | date: 'mediumDate' }}</td>
          <td data-label="Total Price">${{ order.totalPrice }}</td>
          <td data-label="Status">
            <span class="order-status" [ngClass]="{
              'status-pending': order.status === 'pending',
              'status-processing': order.status === 'processing',
              'status-shipped': order.status === 'shipped',
              'status-delivered': order.status === 'delivered',
              'status-cancelled': order.status === 'cancelled'
            }">
              {{ order.status || 'Processing' }}
            </span>
          </td>
          <td data-label="Actions">
            <button class="cancel-button" (click)="cancelOrder(order.id)"
              [disabled]="order.status === 'cancelled' || order.status === 'delivered'">
              {{ (order.status === 'cancelled' || order.status === 'delivered') ? 'Cannot Cancel' : 'Cancel Order' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
