<div class="checkout-container">
  <h1>Checkout</h1>

  <div class="checkout-content">

    <!-- Left Side: Shipping Details -->
    <div class="checkout-left">
      <h3>Shipping Address</h3>
      <p class="message" *ngIf="orderMsg">{{ orderMsg }}</p>

      <form #orderForm="ngForm" class="checkout-form" (ngSubmit)="orderNow(orderForm.value)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="Enter your email" ngModel required email />
        </div>

        <div class="form-group">
          <label>Address</label>
          <input type="text" name="address" placeholder="Enter your address" ngModel required />
        </div>

        <div class="form-group">
          <label>Contact Number</label>
          <input type="tel" name="contact" placeholder="Enter contact details" ngModel required pattern="[0-9]{10}" />
        </div>

        <!-- Payment Methods -->
        <div class="form-group">
          <label>Choose Payment Method</label>
          <div class="payment-options">
            <label>
              <input type="radio" name="paymentMethod" value="COD" [(ngModel)]="selectedPayment" required />
              Cash on Delivery (COD)
            </label>
            <label>
              <input type="radio" name="paymentMethod" value="Credit Card" [(ngModel)]="selectedPayment" required />
              Credit Card
            </label>
            <label>
              <input type="radio" name="paymentMethod" value="UPI" [(ngModel)]="selectedPayment" required />
              UPI (Google Pay, PhonePe, Paytm)
            </label>
            <label>
              <input type="radio" name="paymentMethod" value="Net Banking" [(ngModel)]="selectedPayment" required />
              Net Banking
            </label>
          </div>
        </div>

        <button type="submit" class="checkout-btn" [disabled]="orderForm.invalid">Place Order</button>
      </form>
    </div>

    <!-- Right Side: Order Summary -->
    <div class="checkout-right">
      <h3>Order Summary</h3>
      <div class="order-summary">
        <p><strong>Total Amount:</strong> ₹{{ totalPrice }}</p>
        <p><strong>Payment Method:</strong> <span class="payment-method">{{ selectedPayment || 'Not selected' }}</span></p>
      </div>
    </div>
  </div>
</div>
